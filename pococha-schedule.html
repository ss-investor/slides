<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポコチャ 配信スケジュール メーカー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --pink:#ff7fae; --pink-deep:#ff4f8b; --pink-soft:#ffd9e6;
    --cream:#fff7ef; --gray:#b9b9c4; --yellow:#fff4c2; --yellow-line:#ffe27a;
  }
  *{box-sizing:border-box; font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Rounded Mplus 1c","Hiragino Sans",sans-serif;}
  body{margin:0; background:#f4eef0; color:#5a4a52;}
  .wrap{display:flex; gap:20px; padding:20px; align-items:flex-start; flex-wrap:wrap;}
  .panel{background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 4px 18px rgba(0,0,0,.06);}
  .editor{flex:1 1 380px; max-width:480px;}
  .preview-area{flex:1 1 400px; display:flex; flex-direction:column; align-items:center; gap:14px;}
  h1{font-size:18px; margin:0 0 4px; color:var(--pink-deep);}
  .sub{font-size:12px; color:#998; margin:0 0 14px;}
  label{display:block; font-size:12px; font-weight:bold; margin:12px 0 4px; color:#7a6;}
  input,select,textarea{width:100%; padding:8px 10px; border:1px solid #e3d8dd; border-radius:9px; font-size:14px; background:#fffdfe;}
  textarea{resize:vertical; min-height:46px;}
  .row-item{border:1px solid #f0e2e8; border-radius:11px; padding:10px; margin-bottom:10px; background:#fffafc; position:relative;}
  .row-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .row-grid .full{grid-column:1 / -1;}
  .mini-label{font-size:10px; color:#aa9; margin:0 0 2px; font-weight:bold;}
  .del-btn{position:absolute; top:6px; right:6px; background:#ffd9e6; color:#d6346f; border:none; border-radius:50%; width:22px; height:22px; cursor:pointer; font-weight:bold; line-height:1;}
  .add-btn{width:100%; padding:10px; background:var(--pink-soft); color:var(--pink-deep); border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:14px; margin-top:4px;}
  .add-btn:hover{background:#ffc8dc;}
  .actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .actions button{flex:1; min-width:120px; padding:11px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:14px;}
  .save{background:var(--pink-deep); color:#fff;}
  .save:hover{background:#e83a78;}
  .reset{background:#eee; color:#888;}
  details{margin-top:10px; border-top:1px dashed #eddce4; padding-top:8px;}
  summary{cursor:pointer; font-weight:bold; font-size:13px; color:#c77;}
  .hint{font-size:11px; color:#b0a4aa; margin-top:6px;}

  /* ===== プレビュー（出力されるスケジュール表）===== */
  .card{width:360px; background:
      radial-gradient(circle at 12% 8%, #fff 0 7px, transparent 7px) 0 0/26px 26px,
      linear-gradient(180deg,#ffeaf1,#ffdfeb 40%,#ffe9f0);
    border:7px solid #fff; outline:3px solid var(--pink-soft); border-radius:22px;
    padding:14px 13px 18px; position:relative; overflow:hidden;}
  .lace{position:absolute; inset:7px; border:2px dotted #ffb3cf; border-radius:16px; pointer-events:none;}
  .title-block{text-align:center; position:relative; padding:6px 0 2px;}
  .t-name{display:inline-block; font-size:26px; font-weight:900; color:var(--pink-deep);
    paint-order:stroke fill; -webkit-text-stroke:3px #fff;
    text-shadow:0 2px 3px rgba(255,120,160,.45); letter-spacing:1px;}
  .t-period{font-size:30px; font-weight:900; color:#ff4f8b;
    paint-order:stroke fill; -webkit-text-stroke:3px #fff;
    text-shadow:0 2px 3px rgba(255,120,160,.45); margin:2px 0;}
  .t-banner{display:inline-block; background:linear-gradient(180deg,#ff7fae,#ff5c92);
    color:#fff; font-weight:900; font-size:16px; padding:6px 22px; border-radius:30px;
    box-shadow:0 3px 0 #e23a73; margin-top:4px; position:relative;}
  .t-banner:before,.t-banner:after{content:""; position:absolute; top:50%; width:14px; height:18px;
    background:#ff5c92; transform:translateY(-50%);}
  .t-banner:before{left:-9px; clip-path:polygon(100% 0,100% 100%,0 50%);}
  .t-banner:after{right:-9px; clip-path:polygon(0 0,0 100%,100% 50%);}

  .rows{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .r{display:flex; align-items:stretch; gap:8px; background:#fff; border-radius:13px;
    padding:7px; box-shadow:0 2px 5px rgba(255,140,175,.18); min-height:48px;}
  .r .date{flex:0 0 52px; border-radius:10px; color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:900; line-height:1.05; padding:4px 2px;}
  .r .date .d{font-size:16px;} .r .date .w{font-size:10px; opacity:.95;}
  .r .body{flex:1; display:flex; flex-direction:column; justify-content:center; gap:2px; min-width:0;}
  .tag{align-self:flex-start; font-size:10px; font-weight:900; color:#fff;
    background:var(--pink-deep); padding:2px 9px; border-radius:20px;}
  .r .content{font-size:18px; font-weight:900; color:#ff5c92;}
  .r.off .content{color:#c9b9c2; font-size:17px;}
  .r.off{background:#fff;}

  /* メーター週間ブロック */
  .week{display:flex; gap:8px; background:var(--yellow); border:2px solid var(--yellow-line);
    border-radius:14px; padding:9px; box-shadow:0 2px 5px rgba(255,200,80,.25);}
  .week .wleft{flex:0 0 96px; text-align:center; display:flex; flex-direction:column; justify-content:center;}
  .week .wleft .wrange{font-size:15px; font-weight:900; color:#ff7fae;}
  .week .wleft .wlabel{font-size:12px; font-weight:900; color:#e8943a; margin-top:3px;}
  .week .wmid{flex:1; border-left:2px dashed #f0c873; padding-left:8px; display:flex; flex-direction:column; justify-content:center; gap:5px;}
  .week .wmid .wtop{text-align:center; font-size:12px; font-weight:900; color:#ff7fae; letter-spacing:3px;}
  .week .wmid .wtime{font-size:18px; font-weight:900; color:#ff5c92;}
  .week .wdays{flex:0 0 42px; display:flex; flex-direction:column; justify-content:center; gap:1px;}
  .week .wdays span{font-size:11px; font-weight:900; color:#ff8fb3; text-align:center;}

  .notes{margin-top:12px; display:flex; flex-direction:column; gap:7px;}
  .note{display:flex; gap:7px; align-items:flex-start; font-size:11.5px; color:#7a6a72; line-height:1.4; font-weight:bold;}
  .note .ic{font-size:15px; flex:0 0 auto;}
  .note b{color:var(--pink-deep);}
  .deco{position:absolute; font-size:20px; pointer-events:none;}
</style>
</head>
<body>
<div class="wrap">
  <!-- 入力エリア -->
  <div class="panel editor">
    <h1>🍒 配信スケジュール メーカー</h1>
    <p class="sub">入力すると右側に反映されます。完成したら画像で保存できます。</p>

    <label>お名前 / タイトル</label>
    <input id="f-name" value="本気のみい" oninput="render()">

    <label>期間（例：6月後半）</label>
    <input id="f-period" value="6月後半" oninput="render()">

    <label style="margin-top:16px;">📅 日別スケジュール</label>
    <div id="rows"></div>
    <button class="add-btn" onclick="addRow()">＋ 日付を追加</button>

    <details open>
      <summary>⭐ メーター週間ブロック（任意）</summary>
      <label><input type="checkbox" id="wk-on" style="width:auto" onchange="render()"> 表示する</label>
      <div class="row-grid" style="margin-top:6px;">
        <div><div class="mini-label">期間（上段）</div><input id="wk-from" value="6/15(月)" oninput="render()"></div>
        <div><div class="mini-label">期間（下段）</div><input id="wk-to" value="6/20(土)" oninput="render()"></div>
        <div><div class="mini-label">ラベル</div><input id="wk-label" value="メーター週間" oninput="render()"></div>
        <div><div class="mini-label">🌙 時間</div><input id="wk-night" value="0:00〜5:00" oninput="render()"></div>
        <div><div class="mini-label">☀️ 時間</div><input id="wk-day" value="18:00〜22:00" oninput="render()"></div>
        <div class="full"><div class="mini-label">右の日付リスト（カンマ区切り）</div><input id="wk-days" value="6/15(月),6/16(火),6/17(水),6/18(木),6/19(金),6/20(土)" oninput="render()"></div>
      </div>
    </details>

    <details open>
      <summary>📝 下部の注意書き（任意）</summary>
      <div id="notes"></div>
      <button class="add-btn" onclick="addNote()" style="margin-top:6px;">＋ 注意書きを追加</button>
    </details>

    <div class="actions">
      <button class="save" onclick="download()">📷 画像で保存</button>
      <button class="reset" onclick="resetAll()">リセット</button>
    </div>
    <p class="hint">※ データは自動でこのブラウザに保存されます。次回開いても残ります。</p>
  </div>

  <!-- プレビュー -->
  <div class="preview-area">
    <div id="card" class="card">
      <div class="lace"></div>
      <span class="deco" style="top:8px;left:10px;">🎀</span>
      <span class="deco" style="top:10px;right:12px;">🍒</span>
      <span class="deco" style="bottom:120px;right:8px;">💕</span>
      <div class="title-block">
        <div class="t-name" id="o-name">本気のみい 🍒</div>
        <div class="t-period" id="o-period">6月後半</div>
        <div class="t-banner" id="o-banner">♡ 配信スケジュール ♡</div>
      </div>
      <div class="rows" id="o-rows"></div>
      <div class="notes" id="o-notes"></div>
    </div>
  </div>
</div>

<script>
const DOW = ["日","月","火","水","木","金","土"];
const DATE_COLORS = {gray:"#b9b9c4", pink:"#ff7fae", blue:"#86b8e0", green:"#9ed29a", yellow:"#f4c84a"};

let state = {
  rows: [
    {date:"6/11", dow:"木", type:"meter", tag:"メーター", text:"胃カメラ〜22:00 🍒", color:"pink"},
    {date:"6/12", dow:"金", type:"off", tag:"", text:"オフの日 🎀", color:"gray"},
    {date:"6/13", dow:"土", type:"meter", tag:"メーター", text:"15:00〜22:00 🍒", color:"pink"},
    {date:"6/14", dow:"日", type:"off", tag:"", text:"オフの日 ♡", color:"gray"},
    {date:"6/21", dow:"日", type:"off", tag:"", text:"オフの日 🎀", color:"gray"},
  ],
  notes: [
    {ic:"🌙", text:"夜中は体調と相談しながら <b>8:00まで延長</b> する場合があります ✨"},
    {ic:"⏰", text:"締めの配信は状況に応じて <b>16:00スタート</b> になる場合があります 🎀"},
  ]
};

function saveLocal(){ readInputs(); localStorage.setItem("pococha_sched", JSON.stringify({state, meta:getMeta()})); }
function getMeta(){
  return {
    name:val("f-name"), period:val("f-period"),
    wkOn:document.getElementById("wk-on").checked,
    wkFrom:val("wk-from"), wkTo:val("wk-to"), wkLabel:val("wk-label"),
    wkNight:val("wk-night"), wkDay:val("wk-day"), wkDays:val("wk-days")
  };
}
function loadLocal(){
  const s = localStorage.getItem("pococha_sched");
  if(!s) return;
  try{
    const o = JSON.parse(s);
    state = o.state;
    setVal("f-name",o.meta.name); setVal("f-period",o.meta.period);
    document.getElementById("wk-on").checked = o.meta.wkOn;
    setVal("wk-from",o.meta.wkFrom); setVal("wk-to",o.meta.wkTo); setVal("wk-label",o.meta.wkLabel);
    setVal("wk-night",o.meta.wkNight); setVal("wk-day",o.meta.wkDay); setVal("wk-days",o.meta.wkDays);
  }catch(e){}
}
const val = id => document.getElementById(id).value;
const setVal = (id,v) => { if(v!=null) document.getElementById(id).value = v; };

// ---- 入力欄の生成 ----
function buildRowInputs(){
  const c = document.getElementById("rows"); c.innerHTML="";
  state.rows.forEach((r,i)=>{
    const div = document.createElement("div"); div.className="row-item";
    div.innerHTML = `
      <button class="del-btn" onclick="delRow(${i})">×</button>
      <div class="row-grid">
        <div><div class="mini-label">日付</div><input value="${esc(r.date)}" oninput="upd(${i},'date',this.value)"></div>
        <div><div class="mini-label">曜日</div>
          <select onchange="upd(${i},'dow',this.value)">
            ${DOW.map(d=>`<option ${d===r.dow?'selected':''}>${d}</option>`).join("")}
          </select></div>
        <div><div class="mini-label">日付の色</div>
          <select onchange="upd(${i},'color',this.value)">
            ${Object.keys(DATE_COLORS).map(c=>`<option value="${c}" ${c===r.color?'selected':''}>${colorName(c)}</option>`).join("")}
          </select></div>
        <div><div class="mini-label">種類</div>
          <select onchange="updType(${i},this.value)">
            <option value="meter" ${r.type==='meter'?'selected':''}>メーター</option>
            <option value="off" ${r.type==='off'?'selected':''}>オフ</option>
            <option value="normal" ${r.type==='normal'?'selected':''}>通常</option>
          </select></div>
        <div><div class="mini-label">タグ（任意）</div><input value="${esc(r.tag)}" oninput="upd(${i},'tag',this.value)"></div>
        <div><div class="mini-label">　</div><input value="" disabled style="visibility:hidden"></div>
        <div class="full"><div class="mini-label">内容（時間など）</div><input value="${esc(r.text)}" oninput="upd(${i},'text',this.value)"></div>
      </div>`;
    c.appendChild(div);
  });
}
function buildNoteInputs(){
  const c = document.getElementById("notes"); c.innerHTML="";
  state.notes.forEach((n,i)=>{
    const div = document.createElement("div"); div.className="row-item";
    div.innerHTML = `
      <button class="del-btn" onclick="delNote(${i})">×</button>
      <div class="row-grid">
        <div><div class="mini-label">絵文字</div><input value="${esc(n.ic)}" oninput="updNote(${i},'ic',this.value)"></div>
        <div class="full" style="grid-column:2 / -1"><div class="mini-label">文章（&lt;b&gt;で強調可）</div><input value="${esc(n.text)}" oninput="updNote(${i},'text',this.value)"></div>
      </div>`;
    c.appendChild(div);
  });
}
function colorName(c){return {gray:"グレー",pink:"ピンク",blue:"ブルー",green:"グリーン",yellow:"イエロー"}[c];}

// ---- 操作 ----
function upd(i,k,v){ state.rows[i][k]=v; render(); }
function updType(i,v){
  const r=state.rows[i]; r.type=v;
  if(v==='off'){ r.tag=""; if(!/オフ/.test(r.text)) r.text="オフの日 🎀"; r.color="gray"; }
  if(v==='meter' && !r.tag){ r.tag="メーター"; r.color="pink"; }
  buildRowInputs(); render();
}
function updNote(i,k,v){ state.notes[i][k]=v; render(); }
function addRow(){ state.rows.push({date:"6/22",dow:"月",type:"meter",tag:"メーター",text:"20:00〜22:00 🍒",color:"pink"}); buildRowInputs(); render(); }
function delRow(i){ state.rows.splice(i,1); buildRowInputs(); render(); }
function addNote(){ state.notes.push({ic:"💕",text:"よろしくね ✨"}); buildNoteInputs(); render(); }
function delNote(i){ state.notes.splice(i,1); buildNoteInputs(); render(); }
function readInputs(){}
function esc(s){return (s||"").replace(/"/g,'&quot;');}

// ---- 描画 ----
function render(){
  const name = val("f-name"), period = val("f-period");
  document.getElementById("o-name").innerHTML = esc(name)+" 🍒";
  document.getElementById("o-period").textContent = period;

  // 行
  let html = "";
  state.rows.forEach(r=>{
    const col = DATE_COLORS[r.color]||DATE_COLORS.gray;
    const cls = r.type==='off' ? 'r off' : 'r';
    const tag = r.tag ? `<span class="tag">${esc(r.tag)}</span>` : "";
    html += `<div class="${cls}">
      <div class="date" style="background:${col}"><span class="d">${esc(r.date)}</span><span class="w">(${esc(r.dow)})</span></div>
      <div class="body">${tag}<div class="content">${esc(r.text)}</div></div>
    </div>`;
  });

  // メーター週間
  if(document.getElementById("wk-on").checked){
    const days = val("wk-days").split(",").map(d=>d.trim()).filter(Boolean);
    html += `<div class="week">
      <div class="wleft">
        <div class="wrange">${esc(val("wk-from"))}<br>〜<br>${esc(val("wk-to"))}</div>
        <div class="wlabel">${esc(val("wk-label"))}</div>
      </div>
      <div class="wmid">
        <div class="wtop">‑‑‑ メーター ‑‑‑</div>
        <div class="wtime">🌙 ${esc(val("wk-night"))}</div>
        <div class="wtime">☀️ ${esc(val("wk-day"))}</div>
      </div>
      <div class="wdays">${days.map(d=>`<span>${esc(d)}</span>`).join("")}</div>
    </div>`;
  }
  document.getElementById("o-rows").innerHTML = html;

  // 注意書き
  document.getElementById("o-notes").innerHTML = state.notes.map(n=>
    `<div class="note"><span class="ic">${esc(n.ic)}</span><span>${n.text}</span></div>`).join("");

  saveLocal();
}

function download(){
  const card = document.getElementById("card");
  html2canvas(card,{scale:3,backgroundColor:null,useCORS:true}).then(canvas=>{
    const a = document.createElement("a");
    a.download = `配信スケジュール_${val("f-period")}.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
  });
}
function resetAll(){
  if(confirm("入力内容を消して初期状態に戻しますか？")){
    localStorage.removeItem("pococha_sched"); location.reload();
  }
}

// 初期化
loadLocal();
buildRowInputs();
buildNoteInputs();
render();
</script>
</body>
</html>
